<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b14">
<meta name="description" content="Ritesh Mahato – student, learner and future developer. Projects, skills and contact.">
<title>Ritesh Mahato | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b14;
  --text: #f4f3ff;
  --muted: #a9a8c4;
  --glass: rgba(255,255,255,.06);
  --glass-b: rgba(255,255,255,.12);
  --a: #ff7a59;
  --b: #c04cff;
  --c: #4cc9ff;
  --grad: linear-gradient(120deg, var(--a), var(--b) 55%, var(--c));
  --shadow: 0 20px 60px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  --bg: #f6f4ff;
  --text: #17152b;
  --muted: #5d5b7a;
  --glass: rgba(255,255,255,.65);
  --glass-b: rgba(23,21,43,.1);
  --shadow: 0 20px 50px rgba(90,70,160,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background .4s, color .4s;
}
a { color: inherit; text-decoration: none; }

/* ---------- Aurora background ---------- */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 18s ease-in-out infinite; }
.blob.b1 { width: 420px; height: 420px; background: var(--a); top: -120px; left: -100px; }
.blob.b2 { width: 480px; height: 480px; background: var(--b); top: 30%; right: -160px; animation-delay: -6s; }
.blob.b3 { width: 380px; height: 380px; background: var(--c); bottom: -120px; left: 25%; animation-delay: -12s; }
:root[data-theme="light"] .blob { opacity: .28; }
@keyframes drift {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(60px,40px) scale(1.12); }
