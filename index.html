
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritesh Mahato | My Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #10172a, #123b50);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      width: 100%;
      padding: 40px 24px;
      border: 1px solid #ffffff35;
      border-radius: 24px;
      background: #ffffff10;
      box-shadow: 0 15px 45px #0005;
    }
    .avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #76e4df;
      color: #102030;
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: bold;
    }
    h1 { font-size: 32px; margin-bottom: 10px; }
    p { color: #d5e5f0; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      border-radius: 30px;
      background: #76e4df;
      color: #102030;
      text-decoration: none;
      font-weight: bold;
    }
    footer { margin-top: 28px; color: #b8cad6; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">RM</div>
    <h1>Good Evening! 👋</h1>
    <h2>I'm Ritesh Mahato</h2>
    <p>Welcome to my personal website.</p>
    <p>I'm a student, always learning and building something new. 🚀</p>
    <a href="https://github.com/riteshmahato01">Visit My GitHub</a>
    <footer>Made with ❤️ by Ritesh Mahato</footer>
  </main>
</body>
</html>
