<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritesh Mahato | My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      background: linear-gradient(135deg, #080b20, #191044, #071b35);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 24px;
      text-align: center;
      border: 1px solid rgba(120, 150, 255, 0.4);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 40px rgba(80, 90, 255, 0.2);
    }

    .avatar {
      width: 95px;
      height: 95px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 38px;
      background: linear-gradient(135deg, #725bff, #00cfff);
      box-shadow: 0 0 25px rgba(0, 207, 255, 0.3);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    h1 span {
      color: #68dcff;
    }

    .tagline {
      color: #c7cbe0;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      margin: 6px;
      padding: 13px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #6755ff, #008cff);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      color: #9ba4c5;
      font-size: 13px;
    }
    .avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">
  <img src="file_000000005f04820e8dba20ccf4092cdc (1).png" alt="Ritesh Mahato">
    </div>

    <h1>Hey, I'm <span>Ritesh!</span></h1>

    <p class="tagline">
      Welcome to my personal website ✨<br>
      Student • Learner • Future Developer
    </p>

    <a class="button"
       href="https://github.com/riteshmahato01"
       target="_blank" rel="noopener noreferrer">
      Visit My GitHub ↗
    </a>

    <footer>
      Made with ❤️ by Ritesh Mahato
    </footer>
  </main>
</body>
</html>
